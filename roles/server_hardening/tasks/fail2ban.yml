- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  when: server_hardening_fail2ban_enabled | bool
  tags:
    - fail2ban

- name: Configure Fail2ban SSH jail
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart Fail2ban
  when: server_hardening_fail2ban_enabled | bool
  tags:
    - fail2ban

- name: Ensure Fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: server_hardening_fail2ban_enabled | bool
  tags:
    - fail2ban
