---
# Tasks for the server_hardening role

- name: Display the administrator account we plan to manage
  ansible.builtin.debug:
    msg: "The administrator account will be {{ admin_user }}"

- name: Create the administrator account
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Install SSH public key for the administrator
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
  
- name: Deploy SSH server configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'sshd -t -f %s'
  notify: Reload SSH

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ ufw_default_incoming_policy }}"

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ ufw_default_outgoing_policy }}"

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ ufw_ssh_port }}"
    proto: tcp

- name: Allow HTTPS on web servers
  community.general.ufw:
    rule: allow
    port: "{{ ufw_https_port }}"
    proto: tcp
  when: "'web' in group_names"

- name: Enable UFW
  community.general.ufw:
    state: enabled