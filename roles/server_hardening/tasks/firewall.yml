- name: Set UFW default incoming policy  # noqa: args[module]
  community.general.ufw:
    direction: incoming
    policy: "{{ server_hardening_ufw_default_incoming_policy }}"

- name: Set UFW default outgoing policy  # noqa: args[module]
  community.general.ufw:
    direction: outgoing
    policy: "{{ server_hardening_ufw_default_outgoing_policy }}"

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ server_hardening_ufw_ssh_port }}"
    proto: tcp

- name: Allow HTTPS on web servers
  community.general.ufw:
    rule: allow
    port: "{{ server_hardening_ufw_https_port }}"
    proto: tcp
  when: server_hardening_ufw_allow_https | bool

- name: Allow HTTP on web servers
  community.general.ufw:
    rule: allow
    port: "{{ server_hardening_ufw_http_port }}"
    proto: tcp
  when: server_hardening_ufw_allow_http | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
