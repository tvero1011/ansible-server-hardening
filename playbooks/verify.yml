---
- name: Verify server security
  hosts: all
  become: true

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Report SSH service status
      ansible.builtin.debug:
        msg: "SSH service on {{ inventory_hostname }}: {{ ansible_facts.services.get('ssh.service', {}).get('state', 'not found') }}"
